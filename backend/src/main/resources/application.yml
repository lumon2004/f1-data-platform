# Il database si configura solo da variabili d'ambiente (nomi in .env.example).
# Nome del database, utente e password non hanno valori predefiniti: senza, l'applicazione non parte.
spring:
  application:
    name: f1-data-platform-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    hikari:
      # Database irraggiungibile: la richiesta fallisce in pochi secondi (503) invece di restare
      # appesa per i 30 s predefiniti; vale anche per il controllo di /actuator/health.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 1000
      data-source-properties:
        # Driver PostgreSQL, in secondi: apertura della connessione e attesa massima di una risposta.
        connectTimeout: 2
        socketTimeout: 30
    password: ${POSTGRES_PASSWORD}
  flyway:
    # Le migrazioni di database/migrations (radice del repository) vengono impacchettate
    # nel classpath dalla build Maven; FLYWAY_LOCATIONS permette di puntare altrove.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
