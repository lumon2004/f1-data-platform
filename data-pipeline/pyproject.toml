[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "f1-pipeline"
version = "0.1.0"
description = "Pipeline dati di F1 Data Platform: CSV Kaggle/Ergast -> Parquet -> PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    # Versioni fissate: i byte dei Parquet dipendono dalla versione di PyArrow,
    # e sono le stesse dell'immagine dei test di accettazione.
    "pyarrow==17.0.0",
    "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
f1-pipeline = "f1_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
