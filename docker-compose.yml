# F1 Data Platform — orchestrazione locale.
# Le credenziali arrivano da variabili d'ambiente o da un file .env non versionato (vedi .env.example).
# Oggi: PostgreSQL e la pipeline come strumento a richiesta. Backend, frontend e il caricamento
# automatico del dataset di esempio si aggiungono alla tappa 7.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?imposta POSTGRES_DB (vedi .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?imposta POSTGRES_USER (vedi .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD (vedi .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Pipeline dati come strumento a richiesta: il profilo la tiene fuori da
  # `docker compose up`. Per scaricare il dataset completo:
  #   docker compose run --rm pipeline download --output /data/raw
  # Alla tappa 7 diventa il servizio una tantum che carica il dataset di esempio.
  pipeline:
    build: ./data-pipeline
    profiles: ["strumenti"]
    environment:
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      POSTGRES_HOST: postgres
      # Porta interna alla rete di Compose: POSTGRES_PORT è quella pubblicata sull'host.
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./data-pipeline/raw:/data/raw
      - ./data-pipeline/processed:/data/processed

volumes:
  postgres-data:
