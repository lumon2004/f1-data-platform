# F1 Data Platform — orchestrazione locale.
# Le credenziali arrivano da variabili d'ambiente o da un file .env non versionato (vedi .env.example).
# `docker compose up` avvia PostgreSQL e il backend, poi carica il dataset di esempio.
# Il frontend si aggiunge alla tappa 7.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?imposta POSTGRES_DB (vedi .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?imposta POSTGRES_USER (vedi .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD (vedi .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # API REST. All'avvio applica le migrazioni di database/migrations/ (impacchettate nel jar):
  # per questo il contesto di build è la radice del repository.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      # Porta interna alla rete di Compose: POSTGRES_PORT è quella pubblicata sull'host.
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Pipeline dati: servizio una tantum. Con `docker compose up` carica il dataset di esempio
  # (data-pipeline/sample/, incluso nell'immagine) e termina con codice 0.
  # Lo schema lo crea il backend, quindi parte dopo che il backend è healthy.
  # Altri usi, a richiesta:
  #   docker compose run --rm pipeline download --output /data/raw   (dataset completo da Kaggle)
  #   docker compose run --rm pipeline run --source raw              (carica il dataset completo)
  pipeline:
    build: ./data-pipeline
    command: ["run", "--source", "sample", "--processed", "/tmp/processed"]
    restart: "no"
    environment:
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./data-pipeline/raw:/data/raw
      - ./data-pipeline/processed:/data/processed
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
